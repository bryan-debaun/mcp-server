# Render Blueprint for the MCP server.
#
# This is a Docker service: the image is built from ./Dockerfile, which already
# runs `pnpm run build` (prisma generate -> tsoa routes -> tsc -> seed compile)
# and ships a pruned, production-only node_modules. For Docker services Render
# IGNORES `buildCommand`/`startCommand` in this file — the Dockerfile drives both.
# (A stale dashboard command pointing at the removed `scripts/start-production.sh`
# is what caused the status-2 crash loop; do not reintroduce it.)
#
# ⚠️ THE DASHBOARD "DOCKER COMMAND" FIELD MUST BE EMPTY.
#
# Render → bad-mcp → Settings → Deploy → Docker Command overrides the Dockerfile
# CMD *and* ENTRYPOINT outright. It was set to `node dist/index.js`, which meant
# the boot migration step never executed — not "executed and failed", never ran.
# That is why migrations sat unapplied from 2026-06-28 to 2026-07-31 while the
# code needing them was live. Confirmed 2026-08-01; the field is now cleared.
#
# The blueprint cannot protect you here: a dashboard value silently wins over
# everything in this file and in the Dockerfile. If migrations ever stop applying
# again, check that field FIRST. `/healthz?deep=1` reports pending migrations, so
# the symptom is visible — but the cause is only visible in the dashboard.
#
# MIGRATIONS run automatically at CONTAINER BOOT, via the Dockerfile CMD, which
# runs scripts/docker-entrypoint.sh — PROVIDED the dashboard override above is
# empty. Verified end-to-end against the built production image: given a
# reachable database the entrypoint applies every pending migration correctly.
#
# REQUIRED ENV: DATABASE_URL_DIRECT (Supabase session pooler, port 5432). The
# entrypoint migrates over it because the TRANSACTION pooler (6543) that
# DATABASE_URL points at cannot take the advisory locks `migrate deploy` needs.
# That is a real hazard but it is NOT what caused the 2026-06/07 outage — the
# command simply never ran. If DATABASE_URL_DIRECT is unset the entrypoint falls
# back to DATABASE_URL and warns loudly at boot.
#
# The step is fatal ONLY when the database is reachable and the migration still
# failed — that means a real problem, and the server refuses to start rather than
# serve traffic against a schema it doesn't understand (Render's health-check gate
# keeps the previous revision live). An UNREACHABLE database (paused Supabase free
# project) still starts normally, so health checks stay up.
#
# Escape hatches: BOOT_MIGRATE_NONFATAL=1 restores the old always-start behaviour
# for one deploy; SKIP_BOOT_MIGRATE=1 skips migrations entirely.
#
# To apply out-of-band instead:
#   DATABASE_URL="<direct-url>" pnpm exec prisma migrate deploy
#
# SEEDING is NOT automatic (ADR-0008) — boot never seeds. Run it explicitly from
# the Render Shell when needed: `pnpm exec prisma db seed`.
services:
  - type: web
    name: mcp-server
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    # Deploys are gated on CI (ORR gap #5): `.github/workflows/ci-deploy-render.yml`
    # triggers a deploy hook only after verify + tests + build + db-integration
    # all pass for the commit. With autoDeploy on, Render fires on the push
    # itself and waits for nothing, so a red build could deploy.
    #
    # NOTE: this line only binds if the service is managed by this blueprint. A
    # service created through the dashboard ignores it — turn Auto-Deploy OFF in
    # Render -> bad-mcp -> Settings, and add the Deploy Hook URL as the repo
    # secret RENDER_DEPLOY_HOOK_URL. Until that secret exists the workflow's
    # deploy step is a no-op that warns, so nothing breaks in the meantime.
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
